name: Tests

# Runs the full test suite (local-engine analyzers + React component
# tests) on every push and pull request targeting main, so a
# regression is caught automatically before it reaches production —
# instead of relying on someone remembering to run tests by hand
# before pushing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Temporarily `npm install` instead of `npm ci` — package.json
        # just gained new dependencies (web-tree-sitter,
        # tree-sitter-wasms) that package-lock.json hasn't been
        # regenerated for yet (no network access in the environment
        # that edited package.json). `npm ci` requires the two files
        # to already be in sync and would fail here; `npm install`
        # updates the lock file as needed. Once this run succeeds and
        # the updated package-lock.json this produces gets committed,
        # this can switch back to `npm ci` for its stricter
        # reproducibility guarantees.
        run: npm install

      - name: Run full test suite (local-engine + component tests)
        run: npm run test:all
