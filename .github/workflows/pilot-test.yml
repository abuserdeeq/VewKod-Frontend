name: Tree-sitter Pilot Test

# Manually triggered (no push/PR needed) — this exists so the
# still-open Kotlin/Swift node-type verification (see the
# "CONFIDENCE NOTES" comments in src/localEngine/analyzers/
# kotlin.js and swift.js) can be run entirely on GitHub's servers,
# from a phone browser, with no local terminal or npm install
# required. Every other language has graduated to production
# (src/localEngine/analyzers/) with full test coverage in
# tests/localEngine/, and SQL stays permanently on the old
# regex/indentation analyzer (tree-sitter-wasms has no SQL grammar —
# see analyzers/sql.js) — so this workflow now only runs the AST
# node-type inspector. Tap "Run workflow" on this page, wait for it
# to finish, then open the run and read the "Inspect Kotlin/Swift
# AST node types" step's output.
on:
  workflow_dispatch:

jobs:
  pilot-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pilot-only dependencies
        # Deliberately separate from `npm ci` / the main install —
        # these two packages exist only for this experiment and are
        # not (yet) part of package.json.
        #
        # Versions are PINNED, not "latest". Letting npm grab the
        # newest web-tree-sitter caused a hard failure
        # (getDylinkMetadata / failIf inside web-tree-sitter.js) —
        # the newest core expects grammar .wasm files built in a
        # newer format (with "dylink" metadata describing module
        # dependencies) that tree-sitter-wasms' prebuilt
        # tree-sitter-python.wasm predates. Pinning an older
        # web-tree-sitter that matches the older-format grammar
        # avoids the mismatch.
        run: npm install web-tree-sitter@0.22.6 tree-sitter-wasms@0.1.11 --no-save

      - name: Inspect Kotlin/Swift AST node types
        # Two guesses at Kotlin/Swift node type names came back
        # partially wrong. Print the real node types instead of
        # guessing a third time.
        run: node src/localEngine/pilot/inspect-ast.mjs
